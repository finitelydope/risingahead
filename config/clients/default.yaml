client:
  name: default
  description: "Rising Ahead financial services demo client"

sources:
  customers:
    active: true
    primary_key: customer_id
    watermark_column: last_updated_ts
  accounts:
    active: true
    primary_key: account_id
    watermark_column: last_updated_ts
  transactions:
    active: true
    primary_key: transaction_id
    watermark_column: last_updated_ts
  risk_flags:
    active: true
    primary_key: flag_id
    watermark_column: last_updated_ts

schedule:
  cron_schedule: "0 0 * * *"
  cron_timezone: "UTC"
  enabled: true

quality:
  max_kyc_null_rate_pct: 5.0
  allow_negative_amounts: false

gold:
  customer_risk_features: true
  monthly_analytics: true
